name: Windows build and verification
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build release package with a concurrent source reader
        shell: powershell
        run: |
          $reader = [IO.File]::Open((Join-Path $PWD 'LICENSE'), [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::Read)
          try { ./ProxyDeck/Package.ps1 -OutputDirectory artifacts } finally { $reader.Dispose() }
      - name: Verify configuration and security boundaries
        shell: powershell
        run: |
          $p = Start-Process ./ProxyDeck/build/ProxyDeck.exe -ArgumentList '--verify "verify.json"' -Wait -PassThru
          Get-Content verify.json
          if ($p.ExitCode -ne 0) { throw 'Verification failed' }
      - name: Test official dependencies in an isolated local installation
        shell: powershell
        run: |
          $p = Start-Process ./ProxyDeck/build/ProxyDeck.exe -ArgumentList '--integration-test "integration.json"' -Wait -PassThru
          Get-Content integration.json
          if ($p.ExitCode -ne 0) { throw 'Integration failed' }
      - name: Verify quota parsing and account masking
        shell: powershell
        run: |
          $p = Start-Process ./ProxyDeck/build/ProxyDeck.exe -ArgumentList '--self-test "self-test.json"' -Wait -PassThru
          Get-Content self-test.json
          if ($p.ExitCode -ne 0) { throw 'Quota verification failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: ProxyDeck-Windows-x64
          path: artifacts/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ProxyDeck-Windows-x64
          path: artifacts
      - name: Publish tagged release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $notes = ".github/release-notes/$env:RELEASE_TAG.md"
          if (Test-Path -LiteralPath $notes) {
            gh release create "$env:RELEASE_TAG" ./artifacts/* --verify-tag --title "Proxy Deck $env:RELEASE_TAG" --notes-file "$notes"
          } else {
            gh release create "$env:RELEASE_TAG" ./artifacts/* --verify-tag --title "Proxy Deck $env:RELEASE_TAG" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
